<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Background Moody Showroom Gradients -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080f1d" />
      <stop offset="45%" stop-color="#0d1b2a" />
      <stop offset="85%" stop-color="#1b2a47" />
      <stop offset="100%" stop-color="#0b172a" />
    </linearGradient>

    <!-- Warm Tanzanian Golden Hour Accent Lighting through Showroom Windows -->
    <radialGradient id="sunGlow" cx="85%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.32" />
      <stop offset="35%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#0d1b2a" stop-opacity="0" />
    </radialGradient>

    <!-- Showroom Floor Reflection -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14213d" />
      <stop offset="25%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050a14" />
    </linearGradient>

    <!-- Display Table Materials -->
    <linearGradient id="tableTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="ledStrip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="scrimLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080e1a" stop-opacity="0.96" />
      <stop offset="45%" stop-color="#0d1b2a" stop-opacity="0.88" />
      <stop offset="75%" stop-color="#0d1b2a" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0d1b2a" stop-opacity="0.3" />
    </linearGradient>

    <!-- Blur filter for lights -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" />
    </filter>
  </defs>

  <!-- Base Wall -->
  <rect width="1600" height="900" fill="url(#wallGrad)" />

  <!-- Natural Golden / Blue Sunlight Influx (Dar es Salaam Showroom ambiance) -->
  <rect width="1600" height="900" fill="url(#sunGlow)" />

  <!-- Ambient Overhead Showroom Track Lighting Beams -->
  <g opacity="0.18">
    <polygon points="400,0 600,0 900,600 500,600" fill="#38bdf8" filter="url(#softGlow)" />
    <polygon points="1000,0 1200,0 1500,600 1100,600" fill="#f59e0b" filter="url(#softGlow)" />
  </g>

  <!-- Architectural Kariakoo City Grid Backdrop Lines (Subtle Window Sill View) -->
  <g stroke="#334155" stroke-width="1.5" opacity="0.25">
    <line x1="900" y1="120" x2="1600" y2="120" />
    <line x1="900" y1="280" x2="1600" y2="280" />
    <line x1="1050" y1="50" x2="1050" y2="400" />
    <line x1="1250" y1="50" x2="1250" y2="400" />
    <line x1="1450" y1="50" x2="1450" y2="400" />
    <!-- City silhouette in horizon -->
    <polygon points="980,400 980,240 1020,240 1020,400" fill="#1e293b" opacity="0.4" />
    <polygon points="1120,400 1120,180 1180,180 1180,400" fill="#1e293b" opacity="0.5" />
    <polygon points="1280,400 1280,220 1330,220 1330,400" fill="#1e293b" opacity="0.4" />
    <polygon points="1400,400 1400,260 1440,260 1440,400" fill="#1e293b" opacity="0.5" />
  </g>

  <!-- Showroom Polished Tiled Floor -->
  <polygon points="0,520 1600,520 1600,900 0,900" fill="url(#floorGrad)" />
  <line x1="0" y1="520" x2="1600" y2="520" stroke="#38bdf8" stroke-width="2" opacity="0.5" />

  <!-- Floor Perspective Tile Reflections -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="800" y1="520" x2="500" y2="900" />
    <line x1="950" y1="520" x2="800" y2="900" />
    <line x1="1100" y1="520" x2="1100" y2="900" />
    <line x1="1250" y1="520" x2="1400" y2="900" />
    <line x1="1400" y1="520" x2="1700" y2="900" />

    <line x1="0" y1="600" x2="1600" y2="600" />
    <line x1="0" y1="700" x2="1600" y2="700" />
    <line x1="0" y1="820" x2="1600" y2="820" />
  </g>

  <!-- Modern Retail Tech Counter / Showcase Island (Right Side) -->
  <g id="showroomTable" opacity="0.85">
    <!-- Main Display Island Counter -->
    <polygon points="860,560 1560,560 1520,680 820,680" fill="url(#tableTop)" stroke="#475569" stroke-width="1.5" />
    <!-- Under-counter LED glow -->
    <polygon points="820,680 1520,680 1515,690 825,690" fill="url(#ledStrip)" opacity="0.8" />
    <!-- Table Stand Base -->
    <polygon points="880,690 1460,690 1440,790 900,790" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />

    <!-- Curved 4K Monitor on Display -->
    <rect x="940" y="380" width="220" height="135" rx="8" fill="#050811" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="948" y="388" width="204" height="119" rx="4" fill="#0284c7" opacity="0.75" />
    <!-- Screen graphic lines -->
    <path d="M 948 480 Q 1020 420 1152 450" stroke="#f59e0b" stroke-width="3" fill="none" />
    <polygon points="1035,515 1065,515 1070,565 1030,565" fill="#334155" />

    <!-- Open Ultrabook Laptop on Display -->
    <polygon points="1210,515 1330,515 1315,440 1225,440" fill="#050811" stroke="#94a3b8" stroke-width="1" />
    <polygon points="1228,510 1312,510 1302,448 1238,448" fill="#38bdf8" opacity="0.8" />
    <polygon points="1195,545 1345,545 1330,515 1210,515" fill="#cbd5e1" stroke="#64748b" stroke-width="1" />

    <!-- Flagship Smartphone on Clear Acrylic Stand -->
    <rect x="1390" y="475" width="40" height="75" rx="6" fill="#050811" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="1393" y="478" width="34" height="69" rx="4" fill="#10b981" opacity="0.7" />
    <polygon points="1400,550 1420,550 1425,565 1395,565" fill="#e2e8f0" opacity="0.4" />

    <!-- High-Performance Desktop Tower next to counter -->
    <rect x="1460" y="460" width="75" height="150" rx="8" fill="#090d16" stroke="#f43f5e" stroke-width="1.5" />
    <circle cx="1497" cy="510" r="22" fill="none" stroke="#f43f5e" stroke-width="3" opacity="0.7" />
    <circle cx="1497" cy="565" r="22" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.7" />
  </g>

  <!-- Modern Floating Hexagonal Tech Network Particles -->
  <g opacity="0.25">
    <polygon points="820,180 840,170 860,180 860,205 840,215 820,205" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <polygon points="730,240 750,230 770,240 770,265 750,275 730,265" fill="none" stroke="#f59e0b" stroke-width="1.5" />
    <polygon points="910,270 925,260 940,270 940,290 925,300 910,290" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="840" y1="215" x2="750" y2="230" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="860" y1="205" x2="910" y2="270" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,3" />
  </g>

  <!-- Pande Computers Showroom Wall Branding Plaque (Background) -->
  <g transform="translate(1080, 140)" opacity="0.45">
    <!-- Circular PC Badge Outline -->
    <circle cx="100" cy="50" r="42" fill="none" stroke="#60a5fa" stroke-width="4" />
    <text x="100" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#93c5fd" text-anchor="middle">PC</text>
    <text x="100" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="3" text-anchor="middle">PANDE COMPUTERS</text>
    <text x="100" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#f59e0b" letter-spacing="2" text-anchor="middle">KARIAKOO SHOWROOM</text>
  </g>

  <!-- Contrast Scrim Layer (Heavy dark gradient on left to guarantee WCAG AA contrast for text, buttons and cards) -->
  <rect width="1600" height="900" fill="url(#scrimLeft)" />
</svg>
