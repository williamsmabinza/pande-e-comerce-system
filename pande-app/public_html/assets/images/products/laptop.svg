<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="laptopScreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="bodySilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="keyboardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="300" cy="405" rx="240" ry="22" fill="#0f172a" opacity="0.12" />

  <!-- Laptop Display Lid (Upright) -->
  <g filter="url(#shadow)">
    <!-- Outer Lid Frame -->
    <rect x="110" y="50" width="380" height="250" rx="14" fill="url(#bodySilver)" stroke="#64748b" stroke-width="1.5" />
    <!-- Bezel -->
    <rect x="120" y="60" width="360" height="230" rx="8" fill="#090d16" />
    <!-- Webcam & Sensor -->
    <circle cx="300" cy="67" r="2.5" fill="#38bdf8" />
    <circle cx="288" cy="67" r="1.5" fill="#475569" />
    <!-- Screen Display Area -->
    <rect x="128" y="76" width="344" height="204" rx="4" fill="url(#laptopScreenGrad)" />
    
    <!-- Screen Interface Mockup -->
    <circle cx="230" cy="170" r="45" fill="#60a5fa" opacity="0.25" />
    <circle cx="360" cy="140" r="60" fill="#38bdf8" opacity="0.2" />
    <path d="M 128 240 Q 220 200 320 220 T 472 190 L 472 280 L 128 280 Z" fill="#ffffff" opacity="0.12" />
    <text x="300" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">PANDE COMPUTERS</text>
    <text x="300" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#93c5fd" text-anchor="middle">Uncompromised Power &bull; Kariakoo</text>
    
    <!-- Windows/OS Taskbar -->
    <rect x="128" y="266" width="344" height="14" fill="#0f172a" opacity="0.75" />
    <rect x="290" y="270" width="6" height="6" rx="1" fill="#38bdf8" />
    <rect x="300" y="270" width="6" height="6" rx="1" fill="#60a5fa" />
    <rect x="310" y="270" width="6" height="6" rx="1" fill="#93c5fd" />
  </g>

  <!-- Laptop Base (Perspective Deck) -->
  <!-- Base Body -->
  <polygon points="50,385 550,385 500,295 100,295" fill="url(#bodySilver)" stroke="#64748b" stroke-width="1.5" />
  <!-- Base Front Edge Lip -->
  <rect x="50" y="385" width="500" height="12" rx="4" fill="#94a3b8" />
  <rect x="270" y="386" width="60" height="4" rx="2" fill="#64748b" /> <!-- Thumb Notch -->

  <!-- Keyboard Deck Recess -->
  <polygon points="120,350 480,350 460,305 140,305" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" />
  <!-- Keys Grid Representation -->
  <polygon points="125,348 475,348 456,308 144,308" fill="url(#keyboardGrad)" rx="2" />
  
  <!-- Subtle Key Rows Lines -->
  <line x1="140" y1="316" x2="460" y2="316" stroke="#334155" stroke-width="1" />
  <line x1="135" y1="324" x2="465" y2="324" stroke="#334155" stroke-width="1" />
  <line x1="130" y1="332" x2="470" y2="332" stroke="#334155" stroke-width="1" />
  <line x1="125" y1="340" x2="475" y2="340" stroke="#334155" stroke-width="1" />

  <!-- Touchpad -->
  <polygon points="245,380 355,380 350,355 250,355" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" />
</svg>
