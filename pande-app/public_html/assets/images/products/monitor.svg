<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="monScreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="monBezelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="standGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="monShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Base Table Shadow -->
  <ellipse cx="300" cy="415" rx="220" ry="18" fill="#0f172a" opacity="0.15" />

  <!-- Monitor Stand Base -->
  <ellipse cx="300" cy="395" rx="110" ry="16" fill="url(#standGrad)" stroke="#64748b" stroke-width="1.5" />
  <ellipse cx="300" cy="392" rx="95" ry="12" fill="#e2e8f0" />

  <!-- Stand Neck -->
  <polygon points="282,270 318,270 312,392 288,392" fill="url(#standGrad)" stroke="#64748b" stroke-width="1" />
  <rect x="290" y="320" width="20" height="35" rx="10" fill="#475569" opacity="0.3" /> <!-- Cable Pass -->

  <!-- Monitor Head & Screen -->
  <g filter="url(#monShadow)">
    <!-- Outer Bezel Frame -->
    <rect x="70" y="45" width="460" height="270" rx="10" fill="url(#monBezelGrad)" stroke="#475569" stroke-width="2" />
    <!-- Ultra-Slim Border Frame -->
    <rect x="76" y="51" width="448" height="252" rx="6" fill="#050811" />
    <!-- Screen Glass Panel -->
    <rect x="80" y="55" width="440" height="240" rx="4" fill="url(#monScreenGrad)" />

    <!-- Abstract Colorful Display Artwork -->
    <circle cx="180" cy="140" r="75" fill="#38bdf8" opacity="0.35" filter="blur(10px)" />
    <circle cx="380" cy="180" r="85" fill="#ec4899" opacity="0.3" filter="blur(15px)" />
    <path d="M 80 230 Q 200 120 320 200 T 520 130 L 520 295 L 80 295 Z" fill="#6366f1" opacity="0.35" />
    
    <text x="300" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">4K IPS DISPLAY</text>
    <text x="300" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="1">144Hz &bull; 1ms &bull; HDR Ultra-Vivid</text>

    <!-- Bottom Chin -->
    <rect x="70" y="295" width="460" height="20" rx="2" fill="#0f172a" />
    <circle cx="300" cy="305" r="3" fill="#cbd5e1" /> <!-- Brand Logo Dot -->
    <circle cx="510" cy="305" r="2" fill="#38bdf8" /> <!-- Power LED Indicator -->
  </g>
</svg>
