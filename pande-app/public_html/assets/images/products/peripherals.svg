<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="kbBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="mouseBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="periShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.2" />
    </filter>
  </defs>

  <ellipse cx="300" cy="385" rx="250" ry="25" fill="#0f172a" opacity="0.12" />

  <g filter="url(#periShadow)">
    <!-- Wireless Slim Keyboard -->
    <rect x="50" y="150" width="360" height="190" rx="14" fill="url(#kbBody)" stroke="#475569" stroke-width="1.5" />
    
    <!-- Keyboard Deck Border -->
    <rect x="62" y="162" width="336" height="166" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1" />

    <!-- Function Row Keys -->
    <g fill="#1e293b" rx="2">
      <rect x="70" y="170" width="22" height="14" rx="2" fill="#0284c7" /> <!-- Esc -->
      <rect x="96" y="170" width="18" height="14" rx="2" />
      <rect x="118" y="170" width="18" height="14" rx="2" />
      <rect x="140" y="170" width="18" height="14" rx="2" />
      <rect x="162" y="170" width="18" height="14" rx="2" />
      <rect x="190" y="170" width="18" height="14" rx="2" />
      <rect x="212" y="170" width="18" height="14" rx="2" />
      <rect x="234" y="170" width="18" height="14" rx="2" />
      <rect x="256" y="170" width="18" height="14" rx="2" />
      <rect x="284" y="170" width="18" height="14" rx="2" />
      <rect x="306" y="170" width="18" height="14" rx="2" />
      <rect x="328" y="170" width="18" height="14" rx="2" />
      <rect x="350" y="170" width="40" height="14" rx="2" fill="#ef4444" /> <!-- Del/Pwr -->
    </g>

    <!-- Key Rows Grid (Clean stylized keys) -->
    <g fill="#1e293b">
      <!-- Row 1 -->
      <rect x="70" y="190" width="18" height="18" rx="3" />
      <rect x="92" y="190" width="18" height="18" rx="3" />
      <rect x="114" y="190" width="18" height="18" rx="3" />
      <rect x="136" y="190" width="18" height="18" rx="3" />
      <rect x="158" y="190" width="18" height="18" rx="3" />
      <rect x="180" y="190" width="18" height="18" rx="3" />
      <rect x="202" y="190" width="18" height="18" rx="3" />
      <rect x="224" y="190" width="18" height="18" rx="3" />
      <rect x="246" y="190" width="18" height="18" rx="3" />
      <rect x="268" y="190" width="18" height="18" rx="3" />
      <rect x="290" y="190" width="18" height="18" rx="3" />
      <rect x="312" y="190" width="18" height="18" rx="3" />
      <rect x="334" y="190" width="56" height="18" rx="3" fill="#334155" /> <!-- Backspace -->

      <!-- Row 2 -->
      <rect x="70" y="214" width="28" height="18" rx="3" fill="#334155" /> <!-- Tab -->
      <rect x="102" y="214" width="18" height="18" rx="3" />
      <rect x="124" y="214" width="18" height="18" rx="3" />
      <rect x="146" y="214" width="18" height="18" rx="3" />
      <rect x="168" y="214" width="18" height="18" rx="3" />
      <rect x="190" y="214" width="18" height="18" rx="3" />
      <rect x="212" y="214" width="18" height="18" rx="3" />
      <rect x="234" y="214" width="18" height="18" rx="3" />
      <rect x="256" y="214" width="18" height="18" rx="3" />
      <rect x="278" y="214" width="18" height="18" rx="3" />
      <rect x="300" y="214" width="18" height="18" rx="3" />
      <rect x="322" y="214" width="18" height="18" rx="3" />
      <rect x="344" y="214" width="46" height="18" rx="3" fill="#334155" /> <!-- Enter Top -->

      <!-- Row 3 -->
      <rect x="70" y="238" width="34" height="18" rx="3" fill="#334155" /> <!-- Caps -->
      <rect x="108" y="238" width="18" height="18" rx="3" />
      <rect x="130" y="238" width="18" height="18" rx="3" />
      <rect x="152" y="238" width="18" height="18" rx="3" />
      <rect x="174" y="238" width="18" height="18" rx="3" />
      <rect x="196" y="238" width="18" height="18" rx="3" />
      <rect x="218" y="238" width="18" height="18" rx="3" />
      <rect x="240" y="238" width="18" height="18" rx="3" />
      <rect x="262" y="238" width="18" height="18" rx="3" />
      <rect x="284" y="238" width="18" height="18" rx="3" />
      <rect x="306" y="238" width="18" height="18" rx="3" />
      <rect x="328" y="238" width="62" height="18" rx="3" fill="#0284c7" /> <!-- Enter Bottom -->

      <!-- Row 4 Spacebar row -->
      <rect x="70" y="262" width="26" height="18" rx="3" fill="#334155" />
      <rect x="100" y="262" width="22" height="18" rx="3" fill="#334155" />
      <rect x="126" y="262" width="22" height="18" rx="3" fill="#334155" />
      <rect x="152" y="262" width="140" height="18" rx="4" fill="#38bdf8" opacity="0.9" /> <!-- Spacebar with Cyan Accent -->
      <rect x="296" y="262" width="22" height="18" rx="3" fill="#334155" />
      <rect x="322" y="262" width="22" height="18" rx="3" fill="#334155" />
      <rect x="348" y="262" width="42" height="18" rx="3" fill="#334155" />
    </g>

    <!-- Ergonomic Wireless Mouse -->
    <path d="M 450 210 C 450 160, 480 150, 500 150 C 520 150, 550 160, 550 210 L 550 290 C 550 330, 530 350, 500 350 C 470 350, 450 330, 450 290 Z" fill="url(#mouseBody)" stroke="#475569" stroke-width="1.5" />
    
    <!-- Mouse Button Split & Wheel -->
    <line x1="500" y1="150" x2="500" y2="230" stroke="#0f172a" stroke-width="2" />
    <rect x="495" y="175" width="10" height="26" rx="5" fill="#38bdf8" stroke="#0284c7" stroke-width="1" /> <!-- Scroll Wheel -->
    
    <!-- Thumb Grip Accent -->
    <path d="M 451 220 Q 456 250 451 280" stroke="#0284c7" stroke-width="4" stroke-linecap="round" fill="none" />
  </g>
</svg>
