<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="prnBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="prnShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>

  <ellipse cx="300" cy="390" rx="220" ry="20" fill="#0f172a" opacity="0.15" />

  <g filter="url(#prnShadow)">
    <!-- Main Printer Body -->
    <rect x="130" y="160" width="340" height="200" rx="16" fill="url(#prnBody)" stroke="#94a3b8" stroke-width="2" />
    
    <!-- Top Scanner Lid -->
    <rect x="140" y="140" width="320" height="30" rx="8" fill="#334155" stroke="#1e293b" stroke-width="1.5" />
    <rect x="260" y="148" width="80" height="6" rx="3" fill="#64748b" /> <!-- Handle -->

    <!-- Scanner Bed Glass line -->
    <line x1="145" y1="170" x2="455" y2="170" stroke="#cbd5e1" stroke-width="2" />

    <!-- Control Panel & Color Touchscreen -->
    <rect x="155" y="185" width="90" height="45" rx="6" fill="#0f172a" />
    <rect x="160" y="190" width="55" height="35" rx="3" fill="#0284c7" />
    <circle cx="230" cy="207" r="6" fill="#10b981" /> <!-- Power Button -->

    <!-- Brand Label -->
    <text x="310" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#1e293b" letter-spacing="1">EcoTank Pro</text>
    <text x="310" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#0284c7">Wi-Fi &bull; High Yield Tank</text>

    <!-- Ink Tanks Reservoir Windows (Black, Cyan, Magenta, Yellow) -->
    <rect x="390" y="185" width="65" height="70" rx="6" fill="#0f172a" />
    <!-- Tank 1 (Black) -->
    <rect x="395" y="195" width="10" height="50" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="395" y="210" width="10" height="35" rx="2" fill="#020617" />
    <!-- Tank 2 (Cyan) -->
    <rect x="408" y="195" width="10" height="50" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="408" y="205" width="10" height="40" rx="2" fill="#06b6d4" />
    <!-- Tank 3 (Magenta) -->
    <rect x="421" y="195" width="10" height="50" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="421" y="215" width="10" height="30" rx="2" fill="#ec4899" />
    <!-- Tank 4 (Yellow) -->
    <rect x="434" y="195" width="10" height="50" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="434" y="208" width="10" height="37" rx="2" fill="#eab308" />

    <!-- Paper Output Tray Slot -->
    <rect x="155" y="260" width="220" height="25" rx="4" fill="#0f172a" />
    
    <!-- Printed Document Page Emerging -->
    <polygon points="175,270 355,270 345,340 185,340" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <!-- Document lines -->
    <line x1="200" y1="290" x2="330" y2="290" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />
    <line x1="200" y1="305" x2="310" y2="305" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="200" y1="318" x2="280" y2="318" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

    <!-- Bottom Paper Input Cassette -->
    <rect x="155" y="325" width="290" height="25" rx="4" fill="#94a3b8" stroke="#64748b" stroke-width="1" />
    <rect x="275" y="330" width="50" height="6" rx="2" fill="#475569" />
  </g>
</svg>
