<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="speakerCylinder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="grilleFabric" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="spkShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>
  </defs>

  <ellipse cx="300" cy="385" rx="220" ry="22" fill="#0f172a" opacity="0.16" />

  <g filter="url(#spkShadow)">
    <!-- Rugged Cylindrical Bluetooth Speaker Body -->
    <rect x="130" y="160" width="340" height="180" rx="40" fill="url(#grilleFabric)" stroke="#0369a1" stroke-width="2" />
    
    <!-- Rubberized End Bumpers (Left & Right Bass Radiators) -->
    <rect x="110" y="150" width="35" height="200" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
    <ellipse cx="120" cy="250" rx="8" ry="70" fill="#334155" opacity="0.4" />

    <rect x="455" y="150" width="35" height="200" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
    <ellipse cx="480" cy="250" rx="8" ry="70" fill="#334155" opacity="0.4" />

    <!-- Center Bold Brand Plaque -->
    <rect x="250" y="220" width="100" height="60" rx="10" fill="#dc2626" stroke="#991b1b" stroke-width="2" />
    <text x="300" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Impact', sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">PRO</text>

    <!-- Top Rubber Control Strip & Buttons -->
    <rect x="200" y="145" width="200" height="25" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Power, Bluetooth, Volume Minus, Volume Plus, Play Buttons -->
    <circle cx="230" cy="157" r="6" fill="#38bdf8" />
    <circle cx="265" cy="157" r="6" fill="#60a5fa" />
    <!-- Minus -->
    <rect x="295" y="156" width="10" height="2" fill="#ffffff" />
    <!-- Plus -->
    <path d="M 335 152 L 335 162 M 330 157 L 340 157" stroke="#ffffff" stroke-width="2" />
    <!-- Play Triangle -->
    <polygon points="368,152 376,157 368,162" fill="#ffffff" />

    <!-- Bottom Stable Foot Pad -->
    <rect x="220" y="335" width="160" height="12" rx="6" fill="#0f172a" />
    <text x="300" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="1">40W RMS &bull; IP67 WATERPROOF</text>
  </g>
</svg>
