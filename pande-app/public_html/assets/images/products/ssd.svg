<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldPin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="ssdShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <ellipse cx="300" cy="385" rx="230" ry="20" fill="#0f172a" opacity="0.16" />

  <g filter="url(#ssdShadow)" transform="rotate(-6, 300, 225)">
    <!-- M.2 NVMe SSD Board (2280 Form Factor) -->
    <rect x="100" y="150" width="400" height="150" rx="8" fill="url(#pcbGrad)" stroke="#10b981" stroke-width="1.5" />

    <!-- Gold Contact Fingers (Left Edge M-Key Notch) -->
    <g fill="url(#goldPin)">
      <rect x="94" y="160" width="8" height="130" rx="1" />
      <!-- M-Key Gap -->
      <rect x="90" y="210" width="16" height="20" rx="2" fill="#0f172a" />
    </g>

    <!-- M.2 Screw Mounting Semi-Circle (Right Edge) -->
    <path d="M 500 215 A 12 12 0 0 0 500 235 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />

    <!-- DRAM / NAND Flash Memory Chips -->
    <rect x="130" y="165" width="70" height="120" rx="4" fill="#090d16" stroke="#334155" stroke-width="1.5" />
    <text x="165" y="225" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="9" fill="#94a3b8" text-anchor="middle" transform="rotate(-90, 165, 225)">NAND FLASH 512GB</text>

    <rect x="215" y="165" width="70" height="120" rx="4" fill="#090d16" stroke="#334155" stroke-width="1.5" />
    <text x="250" y="225" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="9" fill="#94a3b8" text-anchor="middle" transform="rotate(-90, 250, 225)">NAND FLASH 512GB</text>

    <!-- Controller Chip (Heat-Dissipating Nickel Coating) -->
    <rect x="305" y="175" width="60" height="70" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="335" cy="210" r="16" fill="#0284c7" opacity="0.3" />
    <text x="335" y="214" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="8" font-weight="700" fill="#38bdf8" text-anchor="middle">PCIE 4.0</text>

    <!-- DRAM Cache Chip -->
    <rect x="305" y="255" width="60" height="30" rx="3" fill="#090d16" stroke="#475569" stroke-width="1" />

    <!-- Metallic Brand Label Strip -->
    <rect x="385" y="165" width="100" height="120" rx="4" fill="#0f172a" stroke="#ca8a04" stroke-width="1.5" />
    <text x="435" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#fef08a" text-anchor="middle">1TB NVMe</text>
    <text x="435" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">UP TO 3,500 MB/s</text>
    <line x1="400" y1="225" x2="470" y2="225" stroke="#ca8a04" stroke-width="1" />
    <text x="435" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" fill="#94a3b8" text-anchor="middle">PANDE COMPUTERS</text>
    <text x="435" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" fill="#10b981" text-anchor="middle">Kariakoo Stock &bull; 5Yr War.</text>
  </g>
</svg>
